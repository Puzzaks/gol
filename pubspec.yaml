name: gol
description: "Interactive Conway's Game of Life simulator with Material 3 eXtended UI."
publish_to: 'none'
version: 1.3.1+26112704

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  m3x: ^0.0.7
  m3x_ui: ^0.1.5
  m3x_core: ^0.0.3
  m3x_dict: ^0.0.4
  m3x_gh: ^0.0.3
  provider: ^6.1.2
  dynamic_color: ^1.7.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - CHANGELOG.md
    - assets/translations/languages.json
    - assets/translations/en.json
    - assets/translations/uk.json
    - assets/patterns/catalog.json
